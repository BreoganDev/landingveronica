backend:
  name: git-gateway
  branch: main

media_folder: "assets"
public_folder: "assets"

locale: es

collections:
  - name: "landing"
    label: "Landing Page"
    files:
      - name: "contenido"
        label: "Contenido de la landing"
        file: "assets/content.json"
        format: json
        fields:

          # ── IDENTIDAD ────────────────────────────────────────
          - label: "Logo (fondo claro)"
            name: "logo"
            widget: "image"
            hint: "Formato recomendado: WebP o PNG con fondo transparente"

          - label: "Logo (fondo oscuro / footer)"
            name: "logo_white"
            widget: "image"
            hint: "Versión del logo para usar sobre fondos oscuros"

          # ── HERO ─────────────────────────────────────────────
          - label: "Titular principal (primera parte)"
            name: "hero_headline"
            widget: "string"
            hint: "Texto que aparece antes de la palabra en itálica"

          - label: "Titular principal (palabra en itálica)"
            name: "hero_italic"
            widget: "string"
            hint: "Esta palabra se muestra en cursiva y color vino"

          - label: "Subtítulo del hero"
            name: "hero_subtitle"
            widget: "string"

          - label: "Texto del botón principal"
            name: "hero_cta"
            widget: "string"

          - label: "Nota bajo el botón"
            name: "hero_note"
            widget: "string"
            hint: "Acepta HTML básico: <strong> para negrita"

          # ── VIDEO ─────────────────────────────────────────────
          - label: "Etiqueta sobre el video"
            name: "video_label"
            widget: "string"

          - label: "Archivo de video"
            name: "video"
            widget: "file"
            hint: "MP4 recomendado. Máximo 100 MB para Netlify"

          - label: "Pie de video"
            name: "video_caption"
            widget: "string"

          # ── SECCIÓN COACH ─────────────────────────────────────
          - label: "Foto de Verónica"
            name: "coach_photo"
            widget: "image"

          - label: "Titular sección coach"
            name: "coach_headline"
            widget: "text"
            hint: "Usa salto de línea para dividir en dos frases"

          - label: "Texto descriptivo"
            name: "coach_body"
            widget: "text"

          - label: "Frase destacada (cita)"
            name: "coach_quote"
            widget: "string"

          # ── BENEFICIOS ────────────────────────────────────────
          - label: "Etiqueta de beneficios"
            name: "benefits_label"
            widget: "string"

          - label: "Titular de beneficios"
            name: "benefits_headline"
            widget: "string"

          - label: "Beneficios"
            name: "benefits"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - { label: "Texto del beneficio", name: "text", widget: "string" }

          - label: "Cierre de beneficios"
            name: "benefits_coda"
            widget: "string"

          # ── PARA QUIÉN ES ─────────────────────────────────────
          - label: "Titular 'Para quién es'"
            name: "forwho_headline"
            widget: "string"

          - label: "Lista de perfiles"
            name: "forwho_items"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - { label: "Descripción del perfil", name: "text", widget: "string" }

          # ── LO QUE NO ES ──────────────────────────────────────
          - label: "Lo que NO es (máximo 3)"
            name: "not_items"
            widget: "list"
            max: 3
            summary: "{{fields.text}}"
            fields:
              - { label: "Texto (se muestra tachado)", name: "text", widget: "string" }

          # ── TESTIMONIOS ───────────────────────────────────────
          - label: "Testimonios"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.author}}"
            fields:
              - { label: "Cita", name: "quote", widget: "text" }
              - { label: "Autor (nombre y edad)", name: "author", widget: "string" }

          # ── FORMULARIO / CTA ──────────────────────────────────
          - label: "Titular del formulario"
            name: "form_headline"
            widget: "string"

          - label: "Texto bajo el titular"
            name: "form_meta"
            widget: "text"

          - label: "Texto del botón de envío"
            name: "form_cta"
            widget: "string"

          # ── WHATSAPP ──────────────────────────────────────────
          - label: "Número de WhatsApp"
            name: "whatsapp_number"
            widget: "string"
            hint: "Sin + ni espacios. Ejemplo: 34667732963"

          - label: "Mensaje predeterminado de WhatsApp"
            name: "whatsapp_message"
            widget: "string"

          # ── FOOTER ────────────────────────────────────────────
          - label: "URL de Instagram"
            name: "instagram_url"
            widget: "string"

          - label: "URL de LinkedIn"
            name: "linkedin_url"
            widget: "string"

          - label: "Teléfono de contacto"
            name: "phone"
            widget: "string"
            hint: "Con prefijo. Ejemplo: +34 667 732 963"

          - label: "Texto de copyright"
            name: "copyright"
            widget: "string"
